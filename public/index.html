<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Iron Man HUD AI System</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: cyan;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
    }
    #video, #canvas {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw; height: 60vh;
      border-radius: 20px;
      box-shadow: 0 0 40px cyan;
    }
    #controls {
      position: fixed;
      top: 20px; left: 20px;
      z-index: 10;
    }
    button {
      background: black;
      border: 2px solid cyan;
      color: cyan;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 10px;
    }
    #clock {
      position: fixed;
      top: 20px; right: 20px;
      font-size: 24px;
      display: none;
    }
    #apiKeyInput {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 20;
    }
    #apiKeyInput input {
      padding: 5px;
      width: 250px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <button onclick="startSystem()">起動</button>
    <button onclick="stopSystem()">停止</button>
  </div>
  <div id="apiKeyInput">
    <input id="apiKey" type="password" placeholder="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" />
  </div>
  <div id="clock"></div>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
  <audio id="lockon-sound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_52e38d4b70.mp3"></audio>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const lockonSound = document.getElementById('lockon-sound');
    const clock = document.getElementById('clock');
    let stream = null;
    let targets = [];
    let detectionLoop = null;
    let isRunning = false;
    let recognition;
    let clockInterval;
    const smoothing = 0.1;
    let deviceTiltWarning = false;

    // 時計表示
    function startClock() {
      clock.style.display = 'block';
      clockInterval = setInterval(() => {
        const now = new Date();
        clock.textContent = now.toLocaleTimeString();
      }, 1000);
    }

    function stopClock() {
      clearInterval(clockInterval);
      clock.textContent = '';
      clock.style.display = 'none';
    }

    // 起動処理
    async function startSystem() {
      if (isRunning) return;
      isRunning = true;
      startClock();

      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      video.srcObject = stream;

      await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js/models');

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      detectLoop();
    }

    function stopSystem() {
      if (!isRunning) return;
      isRunning = false;

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      if (recognition) recognition.stop();
      cancelAnimationFrame(detectionLoop);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stopClock();
    }

    async function detectLoop() {
      if (!isRunning) return;
      const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions());
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (deviceTiltWarning) {
        ctx.fillStyle = 'orange';
        ctx.font = 'bold 32px Arial';
        ctx.fillText('DEVICE TILTED', canvas.width / 2 - 160, 80);
      }

      detections.forEach((detection, i) => {
        const box = detection.box;
        const x = box.x + box.width / 2;
        const y = box.y + box.height / 2;

        if (!targets[i]) {
          targets[i] = { id: `TGT-${i+1}`, x, y };
          lockonSound.play();
        } else {
          targets[i].x += (x - targets[i].x) * smoothing;
          targets[i].y += (y - targets[i].y) * smoothing;
        }

        drawHUD(targets[i].x, targets[i].y, targets[i].id);
      });

      detectionLoop = requestAnimationFrame(detectLoop);
    }

    function drawHUD(x, y, id) {
      const radius = 80;
      const time = Date.now() / 200;
      const pulse = 10 + Math.sin(time) * 5;

      ctx.strokeStyle = 'aqua';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, radius + pulse, 0, 2 * Math.PI);
      ctx.stroke();

      ctx.strokeStyle = 'cyan';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, 2 * Math.PI);
      ctx.stroke();

      for (let i = 0; i < 4; i++) {
        const angle = time + (i * Math.PI / 2);
        const sx = x + Math.cos(angle) * (radius + 30);
        const sy = y + Math.sin(angle) * (radius + 30);
        ctx.beginPath();
        ctx.arc(sx, sy, 5, 0, 2 * Math.PI);
        ctx.fillStyle = 'aqua';
        ctx.fill();
      }

      ctx.strokeStyle = 'cyan';
      ctx.beginPath();
      ctx.moveTo(x - radius - 20, y);
      ctx.lineTo(x + radius + 20, y);
      ctx.moveTo(x, y - radius - 20);
      ctx.lineTo(x, y + radius + 20);
      ctx.stroke();

      ctx.fillStyle = 'cyan';
      ctx.font = 'bold 20px Orbitron, Arial';
      ctx.fillText('LOCKED', x - 35, y - radius - 50);
      ctx.fillText(id, x - 35, y - radius - 25);
    }

    // デバイス傾き検出
    window.addEventListener('deviceorientation', (event) => {
      const gamma = event.gamma || 0;
      deviceTiltWarning = Math.abs(gamma) > 30;
    });

    // 音声認識＋ChatGPT連携
    window.onload = () => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = async (event) => {
        const transcript = event.results[event.results.length - 1][0].transcript.trim();
        console.log('音声:', transcript);
        const apiKey = document.getElementById('apiKey').value.trim();
        if (!apiKey) return alert("APIキーを入力してください");

        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: "gpt-3.5-turbo",
            messages: [{ role: "user", content: `次の音声コマンドに対して実行すべき動作を判断してください: "${transcript}"。起動、停止、またはその他の説明で返してください。` }]
          })
        });

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || "応答できません";
        speak(reply);

        if (reply.includes("起動")) startSystem();
        else if (reply.includes("停止")) stopSystem();
      };

      recognition.onerror = (e) => console.error('認識エラー', e);
      recognition.start();
    };

    // 音声合成（AIがしゃべる）
    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
