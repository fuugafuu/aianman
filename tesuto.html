<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Advanced Iron Man HUD</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    #video, #canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      height: 60vh;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 0 40px cyan;
    }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>

  <!-- ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

  <audio id="lockon-sound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_52e38d4b70.mp3"></audio>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const lockonSound = document.getElementById('lockon-sound');

    let target = null;
    let smoothing = 0.1;

    // 音声認識
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.continuous = true;
    recognition.start();

    recognition.onresult = (event) => {
      const transcript = event.results[event.results.length - 1][0].transcript.trim();
      if (transcript.includes('ロックオン解除')) {
        target = null;
      }
    };

    // カメラ起動（解像度を広げた！）
    navigator.mediaDevices.getUserMedia({
      video: {
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        facingMode: "user"
      }
    }).then(stream => {
      video.srcObject = stream;
    }).catch(err => {
      console.error('カメラエラー:', err);
    });

    // モデル読み込み
    Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js/models')
    ]).then(startDetection);

    function startDetection() {
      video.addEventListener('play', () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        detectFace();
      });
    }

    async function detectFace() {
      const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions());
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (detections.length > 0) {
        // 一番大きい顔を選ぶ
        let bestDetection = detections[0];
        let maxArea = bestDetection.box.width * bestDetection.box.height;

        detections.forEach(d => {
          const area = d.box.width * d.box.height;
          if (area > maxArea) {
            bestDetection = d;
            maxArea = area;
          }
        });

        const box = bestDetection.box;
        const faceCenterX = box.x + box.width / 2;
        const faceCenterY = box.y + box.height / 2;

        if (!target) {
          target = { x: faceCenterX, y: faceCenterY };
          lockonSound.play(); // ロックオン音を鳴らす！
        } else {
          target.x += (faceCenterX - target.x) * smoothing;
          target.y += (faceCenterY - target.y) * smoothing;
        }

        // 傾きすぎ警告
        if (faceCenterX < canvas.width * 0.2 || faceCenterX > canvas.width * 0.8) {
          ctx.fillStyle = 'red';
          ctx.font = 'bold 40px Arial';
          ctx.fillText('ROTATION WARNING', canvas.width / 2 - 180, 100);
        }
      }

      if (target) {
        drawHUD(target.x, target.y);
      }

      requestAnimationFrame(detectFace);
    }

    function drawHUD(x, y) {
      const radius = 80;
      const time = Date.now() / 300;

      // 外円
      ctx.strokeStyle = 'cyan';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, 2 * Math.PI);
      ctx.stroke();

      // スライス円
      for (let i = 0; i < 8; i++) {
        const angleStart = (i * Math.PI / 4) + (time / 2);
        const angleEnd = angleStart + Math.PI / 8;
        ctx.beginPath();
        ctx.arc(x, y, radius + 20, angleStart, angleEnd);
        ctx.stroke();
      }

      // 回転ポイント
      for (let i = 0; i < 4; i++) {
        const angle = time + (i * Math.PI / 2);
        const sx = x + Math.cos(angle) * (radius + 30);
        const sy = y + Math.sin(angle) * (radius + 30);
        ctx.beginPath();
        ctx.arc(sx, sy, 5, 0, 2 * Math.PI);
        ctx.fillStyle = 'aqua';
        ctx.fill();
      }

      // 十字線
      ctx.strokeStyle = 'cyan';
      ctx.beginPath();
      ctx.moveTo(x - radius - 20, y);
      ctx.lineTo(x + radius + 20, y);
      ctx.moveTo(x, y - radius - 20);
      ctx.lineTo(x, y + radius + 20);
      ctx.stroke();

      // ロックオンラベル
      ctx.fillStyle = 'cyan';
      ctx.font = 'bold 24px Orbitron, Arial';
      ctx.fillText('LOCKED', x - 40, y - radius - 40);
    }

  </script>
</body>
</html>
